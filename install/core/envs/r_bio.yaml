# Default base env pack (weft rewrite W3.4) — R / BIOCONDUCTOR, shipped by the
# installer into $ABA_HOME/installation/envs/ on FRESH personal installs
# (see python_bio.yaml). Under weft, R and Python are two named
# packs (two EnvIDs), decoupled exactly as today's separate conda envs are —
# bumping R can't touch the Python base.
#
# first_use by default: the Bioconductor toolchain is heavy, so it materializes
# on first R demand rather than eagerly (the current r-bio module policy).

name: r-bio
title: R / Bioconductor
languages: [r]
default_state: first_use
first_use: [Seurat, .rds, r-bio]
role: base
import_names:
  SingleCellExperiment: bioconductor-singlecellexperiment
  DESeq2: bioconductor-deseq2

spec:
  platforms: [linux-64, osx-arm64]
  # r-presto + the bioconductor-* set live on bioconda (both osx-arm64 and
  # linux-64); weft's default is conda-forge only, so without this every
  # bioconda-only dep is "no candidates" (r-presto reported first). conda-forge
  # first is the standard bioconda channel order.
  channels: [conda-forge, bioconda]
  # What this pack PROMISES. weft enforces it as a realize postcondition, so a
  # pack that cannot LOAD what it advertises fails to publish instead of
  # shipping. This is not a restatement of the dep list: a conda package whose
  # payload arrives via a POST-LINK script (the bioconductor-*data packages)
  # installs as a few KB of scripts and is present by every name-based check
  # while being empty in fact. bioconductor-genomeinfodbdata is exactly that,
  # and it is why DESeq2/GenomeInfoDb/GenomicRanges never loaded in the
  # published pack — discovered 2026-08, long after shipping. Everything
  # `import_names` advertises must appear here (guarded by
  # tests/test_base_pack_completeness.py).
  verify:
    loads: [Seurat, Matrix, igraph, irlba, dplyr, ggrepel, hdf5r, presto,
            BiocManager, biomaRt, SingleCellExperiment, DESeq2, edgeR, limma,
            GenomeInfoDb, GenomicRanges, SummarizedExperiment,
            Rsamtools, Signac]
  # bioconductor-genomeinfodbdata ships NO payload. The conda package is two
  # scripts totalling 127 bytes; its post-link.sh calls
  #     installBiocDataPackage.sh "genomeinfodbdata-1.2.13"
  # to fetch the real data at install time. pixi/rattler STAGE post-link
  # scripts and never run them, so conda-meta records the package as installed
  # while GenomeInfoDbData does not exist on disk — and GenomeInfoDb,
  # GenomicRanges, SummarizedExperiment and DESeq2 all then fail to load. That
  # is why DESeq2 has never worked in a published pack (found 2026-08, while
  # investigating an unrelated report).
  #
  # Deliver the SAME version from a pinned URL — never "latest", because an
  # EnvID must mean one thing in every realization — then remove the staged
  # script: removing it is how weft's post-link check is acknowledged, and it
  # refuses the build if we don't.
  post_install:
  - |
    set -eu
    Rscript -e 'install.packages("https://bioconductor.org/packages/3.20/data/annotation/src/contrib/GenomeInfoDbData_1.2.13.tar.gz", repos = NULL, type = "source")'
    Rscript -e 'library(GenomeInfoDbData)'
    rm -f "$CONDA_PREFIX/bin/.bioconductor-genomeinfodbdata-post-link.sh"
  deps:
    conda:
      - r-base =4.4.*
      - r-remotes
      - r-biocmanager
      - r-irkernel
      - r-matrix
      - r-rcpp
      - r-rcpparmadillo
      - r-rcppeigen
      - r-rcppprogress
      - r-igraph
      - r-irlba
      - r-xml2
      - r-hdf5r
      - r-ggrepel
      - r-kernsmooth
      - r-dplyr
      - r-seurat
      - r-presto
      - bioconductor-biomart
      - bioconductor-singlecellexperiment
      - bioconductor-deseq2
      - bioconductor-edger
      - bioconductor-limma
      # ATAC / alignment: both reported missing from the field (2026-08).
      # Signac is the Seurat-side ATAC toolkit and rides the Seurat stack
      # already here; Rsamtools is what anything touching BAM/tabix needs.
      - bioconductor-rsamtools
      - r-signac
      # zlib DEV headers (zlib.h), not just the runtime libzlib the R stack
      # pulls in transitively: the cran lane below compiles from source
      # whenever PPM has no matching binary, and lstar's C++ core includes
      # <zlib.h>. Without this the pack realize dies at
      #   fatal error: zlib.h: No such file or directory
      # (measured on the first /resources/aba publish, 2026-07-23).
      - zlib
    # CRAN lane — for packages with no conda-forge/bioconda build. Solved into
    # the SAME closure as the conda lane, so the pack stays one EnvID.
    cran:
      # The R side of the lstar interchange model (viewer store + Seurat/SCE
      # bridge). Baked here rather than installed on demand: the on-demand
      # route source-compiles against zlib.h, which the base lacks — that dead
      # end cost a live session an isolated-env fork (misc/paths.md era, live
      # 2026-07-23). No conda-forge `r-lstar` exists; PPM (weft's default repo)
      # serves the CRAN binary.
      #
      # PINNED, and part of the lockstep set (tests/test_lstar_lockstep.py): the
      # same version must appear as `lstar-sc` in python_bio.yaml, because a
      # store one lane writes is read by the other and by the pagoda3 dist. A
      # bare name is what makes skew SILENT — the pack simply bakes whatever the
      # repo happens to serve. weft resolves a cran `==` as an assertion against
      # its snapshot, so when CRAN moves ahead of this pin the solve FAILS
      # (env.solve_conflict, naming both versions) instead of quietly shipping a
      # mismatched pair. That failure is the signal to bump the whole set — the
      # guard lists every member.
      - lstar ==0.2.2
  # No extra r_repositories. Live CRAN was listed here for one reason — weft's
  # PPM snapshot lags UTC-today − 2, and that lag HID a fresh lstar (0.2.1
  # published 07-22; the 07-21 and 07-22 snapshots both still served 0.1.0), so
  # an UNPINNED dep would have baked the old version. The pin above removes the
  # need: the snapshot carries 0.2.2 (from 2026-08-05), and a lag that hides a
  # FUTURE release now fails the solve rather than passing the wrong version.
  # Re-adding a live repo would restore the silent-skew path, since
  # install.packages() takes the highest version across repos.
  # release_repos: []
