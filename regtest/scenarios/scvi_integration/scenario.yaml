id: scvi_integration
title: Batch integration of two scRNA-seq samples with scVI
domain: genomics
summary: 'Upgraded v1 -> v2 on 2026-08-25. As a v1 stub its only assertion was prose (must_mention/must_not),
  which an agent satisfies by DESCRIBING the analysis. The same weakness let bulk_de stay green for the
  whole period in which DESeq2 could not load at all. `produces` is the assertion that cannot be talked
  past: the UMAP the prompt explicitly asks for only exists if the work actually ran.'
data_files:
- adata.h5ad
lifecycle: []
steps:
- id: s1
  kind: analyze
  actor: agent
  prompt: I have two batches of single-cell RNA-seq in DATA_DIR/adata.h5ad — raw counts are in .X and
    the batch label is in obs['batch'] (batchA, batchB). The two batches don't overlap on a plain UMAP
    because of batch effects. Please integrate them with scVI, then cluster the integrated latent space
    and give me a UMAP colored by batch and by cluster so I can check the batches are mixed while the
    cell populations stay separate.
  expect:
    must_mention:
    - scVI
    - batch
    - integrat
    - UMAP
    must_not: []
    produces:
      figure: 1
    checks: 'Live install test for the new single-cell stack: the agent should discover + read the scvi-integration
      recipe, ensure_capability("scvi-tools") (heavy pip/torch install, materialized into the overlay),
      set up the AnnData with batch_key="batch", train scVI (few epochs is fine on this toy set), compute
      the latent rep, neighbors+leiden+UMAP, and report that batches mix while the 3 hidden cell types
      (cell_type_truth — Tcell/Bcell/Myeloid) stay separable. No fabricated metrics; raw counts (.X) go
      into scVI, never log/normalized values.'
expected_overall:
  notes: 'Live install test for the new single-cell stack: the agent should discover + read the scvi-integration
    recipe, ensure_capability("scvi-tools") (heavy pip/torch install, materialized into the overlay),
    set up the AnnData with batch_key="batch", train scVI (few epochs is fine on this toy set), compute
    the latent rep, neighbors+leiden+UMAP, and report that batches mix while the 3 hidden cell types (cell_type_truth
    — Tcell/Bcell/Myeloid) stay separable. No fabricated metrics; raw counts (.X) go into scVI, never
    log/normalized values.'
